  - id: turn-based
    anchor: turn-based
    emoji: "🎙️"
    title_en: "1. Turn-based Speech & Omni LLMs"
    title_zh: "1. 轮次式语音与 Omni 大模型"
    intro_en: "Half-duplex or request–response speech/Omni models that understand audio (and often vision) and generate text and/or speech. Streaming output does not imply listening while speaking."
    intro_zh: "半双工或请求–响应式语音/Omni 模型：能理解音频（常含视觉）并生成文本和/或语音。流式输出不等于说话时仍在聆听。"
    children:
      - id: early-speech-lm
        anchor: early-speech-lm
        title_en: "Early Speech–Language Models"
        title_zh: "早期语音–语言模型"
      - id: e2e-speech-dialogue
        anchor: e2e-speech-dialogue
        title_en: "End-to-End Spoken Dialogue Models"
        title_zh: "端到端口语对话模型"
      - id: omni-generation
        anchor: omni-generation
        title_en: "Omni Models with Speech Generation"
        title_zh: "带语音生成的 Omni 模型"

  - id: full-duplex
    anchor: full-duplex
    emoji: "🔄"
    title_en: "2. Full-Duplex Interaction Models"
    title_zh: "2. 全双工交互模型"
    intro_en: "Systems whose time axis supports (or explicitly coordinates) listening and speaking concurrently. We follow the engineered vs learned synchronization taxonomy from FD-SLM surveys—not a quality ranking."
    intro_zh: "时间轴支持（或显式协调）同时听说的系统。分类沿用 FD-SLM 综述中的 engineered vs learned 同步谱系——这不是质量排行。"
    children:
      - id: duplex-engineered
        anchor: duplex-engineered
        title_en: "2.1 Engineered Sync (Controller / Cascade)"
        title_zh: "2.1 Engineered 同步（控制器 / 级联）"
      - id: duplex-multistream
        anchor: duplex-multistream
        title_en: "2.2 Learned Sync: Multi-Stream / Dual-Channel"
        title_zh: "2.2 Learned 同步：多流 / 双通道"
      - id: duplex-tdm
        anchor: duplex-tdm
        title_en: "2.3 Learned Sync: Time-Division / Chunk / State Tokens"
        title_zh: "2.3 Learned 同步：时分复用 / 分块 / 状态 Token"

  - id: dual-system
    anchor: dual-system
    emoji: "🧠"
    title_en: "3. Brain–Cerebellum Dual Systems"
    title_zh: "3. 大小脑双系统"
    intro_en: "Fast front-end interaction (cerebellum / System 1 / Talker) runs concurrently with a slower back-end reasoner or agent (brain / System 2). Results are injected back into the live conversation. Distinct from Thinker–Talker (semantic vs acoustic modules inside one model)."
    intro_zh: "快速前台交互（小脑 / System 1 / Talker）与较慢的后台推理或智能体（大脑 / System 2）并发运行，结果回流到实时对话。区别于 Thinker–Talker（同一模型内语义 vs 声学模块）。"
    children:
      - id: dual-concepts
        anchor: dual-concepts
        title_en: "3.1 Concepts & Frameworks"
        title_zh: "3.1 概念与框架"
      - id: dual-open
        anchor: dual-open
        title_en: "3.2 Open Dual-System Models"
        title_zh: "3.2 开放双系统模型"
      - id: dual-cascade
        anchor: dual-cascade
        title_en: "3.3 Fast–Slow Cascades & Speculative Handoff"
        title_zh: "3.3 快慢级联与投机交接"
      - id: dual-closed
        anchor: dual-closed
        title_en: "3.4 Closed Dual-System Products"
        title_zh: "3.4 闭源双系统产品"

  - id: think-while
    anchor: think-while
    emoji: "💭"
    title_en: "4. Think-while-Listening / Speaking"
    title_zh: "4. 边听边想 / 边说边想"
    intro_en: "Methods that use listening or speaking time for causal reasoning—within one model timeline—without waiting for a full user turn or a separate backend."
    intro_zh: "在同一模型时间轴上，利用聆听或说话时段做因果推理的方法——不必等完整用户轮次，也不必依赖独立后台。"

  - id: agentic
    anchor: agentic
    emoji: "🛠️"
    title_en: "5. Agentic Interactive Models & Harness"
    title_zh: "5. Agentic 交互模型与 Harness"
    intro_en: "Interactive systems that call tools, retrieve knowledge, or run long tasks while conversation continues. A harness is the runtime that organizes context, tools, task state, permissions, and result delivery—outside (or around) the front-end model."
    intro_zh: "在对话持续进行时调用工具、检索知识或执行长任务的交互系统。Harness 是组织上下文、工具、任务状态、权限与结果投递的运行时——位于前台模型之外（或环绕其周围）。"
    children:
      - id: agentic-native
        anchor: agentic-native
        title_en: "5.1 Native Tool / RAG / Action Channels"
        title_zh: "5.1 原生工具 / RAG / 动作通道"
      - id: agentic-harness
        anchor: agentic-harness
        title_en: "5.2 Interaction Harness & Runtimes"
        title_zh: "5.2 交互 Harness 与运行时"
      - id: agentic-frameworks
        anchor: agentic-frameworks
        title_en: "5.3 Voice Agent Frameworks & SDKs"
        title_zh: "5.3 语音 Agent 框架与 SDK"
      - id: agentic-memory
        anchor: agentic-memory
        title_en: "5.4 Memory for Interactive Agents"
        title_zh: "5.4 交互智能体的记忆"

  - id: streaming-omni
    anchor: streaming-omni
    emoji: "👁️"
    title_en: "6. Streaming Omni & Proactive Vision"
    title_zh: "6. 流式 Omni 与主动视觉交互"
    intro_en: "Audio–visual assistants that process continuous video, decide when to speak, and optionally generate speech. Includes proactive when-to-speak Video-LLMs."
    intro_zh: "处理连续视频、决定何时发言、并可生成语音的音视频助手。包含主动式 when-to-speak 视频大模型。"
    children:
      - id: streaming-omni-assistants
        anchor: streaming-omni-assistants
        title_en: "6.1 Streaming / Duplex Omni Assistants"
        title_zh: "6.1 流式 / 双工 Omni 助手"
      - id: when-to-speak
        anchor: when-to-speak
        title_en: "6.2 When-to-Speak Video LLMs"
        title_zh: "6.2 When-to-Speak 视频大模型"

  - id: embodied
    anchor: embodied
    emoji: "🤖"
    title_en: "7. Embodied Interaction"
    title_zh: "7. 具身交互"
    intro_en: "Robots and embodied agents that talk and act under continuous sensory streams, including full-duplex speech+action and dual-system VLAs that accept mid-task language corrections."
    intro_zh: "在连续感知流下边说边做的机器人与具身智能体，包括全双工语音+动作，以及可接受任务中语言纠正的双系统 VLA。"
    children:
