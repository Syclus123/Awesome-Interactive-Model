- id: cat-D21
  name: MiniCPM-Duo / DUO
  title: Enabling Real-Time Conversations with Minimal Training Costs
  date: 2024-09
  venue: ''
  org: Tsinghua University / HIT et al.
  status: paper_only
  star: false
  links:
    arxiv: https://arxiv.org/abs/2409.11727
    docs: https://aclanthology.org/2025.ccl-1.85/
  sections:
  - duplex-tdm
  note_en: Parallel decoding branches with channel switching via state tokens, at minimal training cost; a text-channel model separate from MiniCPM-Duplex and MiniCPM-o.
  note_zh: 通过状态 token 切换通道的并行解码分支，训练成本低；文本通道模型，与 MiniCPM-Duplex 和 MiniCPM-o 是不同工作。
  license: Licenses for standalone weights and speech system unverified
  modalities: Dual-channel text streams; speech via surrounding system
  source_group: D
